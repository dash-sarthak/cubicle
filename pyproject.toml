[project]
name = "cubicle"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.22.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
cubicle = "cubicle.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-bdd>=9.0.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
indent-width = 2
line-length = 100

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "features"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["features"]
